<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>Galley · 管理</title><style>
:root{--bg:#090a0d;--text:#f3f4f7;--muted:#969ca8;--line:#282c35}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 18% -10%,#242039 0,transparent 30%),radial-gradient(circle at 88% 0,#18243a 0,transparent 25%),var(--bg);font-family:Inter,system-ui,sans-serif}
button,input,select{font:inherit}.shell{max-width:1240px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:18px}.brand{display:flex;gap:13px;align-items:center}.sigil{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;display:grid;place-items:center;background:#11131a;font:700 20px Georgia,serif}.brand h1{margin:0;font-size:17px;letter-spacing:.18em}.brand small{display:block;color:var(--muted);margin-top:4px}.btn{border:1px solid var(--line);background:#13161d;color:var(--text);border-radius:10px;padding:9px 13px;text-decoration:none}
.hero{padding:58px 0 34px}.hero h2{font:500 clamp(42px,6vw,72px) Georgia,serif;letter-spacing:-.04em;margin:0 0 14px}.hero p{color:#b2b6c0}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:30px}.stat b{font-size:28px}.stat span{display:block;color:var(--muted);font-size:11px}
.toolbar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(9,10,13,.85)}.toolbar .shell{display:flex;gap:8px;align-items:center;padding-top:12px;padding-bottom:12px}.search{flex:1;min-width:200px}.search,.sort{background:#0f1117;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.chip{border:1px solid var(--line);background:#101218;color:var(--muted);border-radius:999px;padding:8px 11px;cursor:pointer}.chip.active{background:#eee;color:#111}
.year{margin:32px 0 44px}.year h2{font:500 32px Georgia,serif;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{border:1px solid var(--line);background:#111319;border-radius:18px;overflow:hidden;cursor:pointer}.cover{aspect-ratio:2/3;background:#05060a;display:flex;align-items:flex-end}.cover img{width:100%;height:100%;object-fit:contain}.ph{padding:18px;font:28px Georgia,serif}.body{padding:14px}.meta{font-size:11px;color:var(--muted)}.body h3{font-size:15px;margin:8px 0 13px}.rating{font:25px Georgia,serif}.empty{border:1px dashed var(--line);border-radius:16px;padding:48px;text-align:center;color:var(--muted)}
@media(max-width:680px){.shell{padding:17px}.toolbar .shell{overflow:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}

.detail-view .hero{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:48px;align-items:start}.detail-view .cover{background:#05060a;border:1px solid var(--line);border-radius:22px;overflow:hidden}.detail-view .cover img{width:100%;height:auto;display:block}.detail-view .placeholder{aspect-ratio:2/3;display:flex;align-items:flex-end;padding:24px;background:linear-gradient(145deg,#3b4055,#191725);font:34px Georgia,serif}.detail-view .kicker{color:var(--accent);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px}.detail-view .title{font:500 clamp(44px,6vw,78px) Georgia,serif;letter-spacing:-.045em;line-height:.98;margin:12px 0 20px}.detail-view .meta{color:var(--muted);line-height:1.8}.detail-view .overall{margin-top:28px;display:flex;align-items:flex-end;gap:12px}.detail-view .scorebig{font:72px Georgia,serif;line-height:.85}.detail-view .outof{color:var(--muted);font-size:16px;margin-bottom:7px}.detail-view .section{margin-top:52px;padding-top:28px;border-top:1px solid var(--line)}.detail-view .section h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#b8bdc8;margin:0 0 20px}.detail-view .scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.detail-view .score{padding:18px;border:1px solid var(--line);background:rgba(17,19,25,.75);border-radius:15px}.detail-view .scorehead{display:flex;justify-content:space-between;gap:10px}.detail-view .scorenum{font:26px Georgia,serif}.detail-view .bar{height:5px;border-radius:999px;background:#252a34;overflow:hidden;margin-top:14px}.detail-view .bar span{display:block;height:100%;background:linear-gradient(90deg,#8175b8,#d8d0ff)}.detail-view .review{white-space:pre-wrap;font-size:17px;line-height:1.9;color:#d8dbe2;max-width:920px}.detail-view .tags{display:flex;gap:8px;flex-wrap:wrap}.detail-view .tag{border:1px solid var(--line);background:#171a21;border-radius:999px;padding:6px 9px;color:#c5c9d1;font-size:12px}.detail-view .empty{border:1px dashed var(--line);border-radius:18px;padding:50px;text-align:center;color:var(--muted)}
@media(max-width:800px){.detail-view .shell{padding:18px}.detail-view .hero{grid-template-columns:1fr;gap:26px}.detail-view .cover{max-width:330px}.detail-view .scores{grid-template-columns:1fr 1fr}}@media(max-width:520px){.detail-view .scores{grid-template-columns:1fr}.detail-view .title{font-size:46px}.detail-view .scorebig{font-size:58px}}


[hidden]{display:none!important}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mode{font-size:12px;letter-spacing:0;color:#c9b7ff;margin-left:8px}
button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.primary{background:#eee;color:#111;border-color:#eee}.danger{color:#ffb2b2;border-color:#553033;background:transparent}.muted{color:var(--muted);font-size:14px;line-height:1.6}
.status{max-width:1240px;margin:0 auto;padding:0 24px 12px;line-height:1.6;font-size:14px;white-space:pre-wrap}.status:empty{display:none}.bad{color:#ffaaaa}.ok{color:#a8d9b2}
.card-open{display:block;border:0;padding:0;width:100%;background:transparent;color:inherit;text-align:left;cursor:pointer;font:inherit}.card-edit{display:block;width:calc(100% - 28px);margin:0 14px 14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#191b25;color:#d9d5ef}
.card:focus-within,.card:hover{border-color:#777089}.card-open:focus-visible,.card-edit:focus-visible{outline:2px solid #c9b7ff;outline-offset:-3px}
dialog{padding:0;color:var(--text);background:#111319;border:1px solid #383c48;border-radius:20px;width:min(960px,calc(100% - 32px));max-height:90dvh;overflow:auto;box-shadow:0 30px 90px #0008}
dialog::backdrop{background:#05060bc9;backdrop-filter:blur(5px)}.dialog-inner{padding:26px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.dialog-head h2{font-size:22px;margin:0}.dialog-head .btn{flex-shrink:0}#auth{max-width:460px}
.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:14px;color:#b4b9c5}input,select,textarea{font:inherit}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#090b10;color:var(--text);border-radius:10px;padding:11px 12px}textarea{min-height:110px;resize:vertical}#review{min-height:260px;line-height:1.8}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.form-scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}.form-footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.cover-preview{max-width:100px;max-height:140px;object-fit:contain;display:block;border-radius:8px;margin:12px 0}
details{border-top:1px solid var(--line);padding:20px 0 0;margin-top:22px}summary{cursor:pointer;font-size:16px}#tools h3{font-size:16px}.detail-view .section{margin-top:30px}#account{margin:0 0 18px}.detail-view .hero{padding:0}
@media(max-width:700px){.top{align-items:flex-start}.actions{justify-content:flex-end}.brand small{display:none}.hero{padding-top:30px}.dialog-inner{padding:18px}.form-grid{grid-template-columns:1fr}.form-scores{grid-template-columns:1fr 1fr}.status{padding-left:18px;padding-right:18px}}@media(max-width:430px){.form-scores{grid-template-columns:1fr}.mode{display:block;margin:4px 0}.actions .btn{padding:8px 10px;font-size:14px}}
</style><script src="./admin.js" defer></script></head><body>
<div class="shell"><header class="top"><div class="brand"><div class="sigil">G</div><div><h1>GALLEY <span class="mode">管理</span></h1><small>personal media log</small></div></div><div class="actions"><a class="btn" href="./">查看前台</a><button class="btn primary" id="new" hidden>添加作品</button><button class="btn" id="tools-open" hidden>更多</button><button class="btn" id="login-open">登录</button><button class="btn" id="logout" hidden>退出</button></div></header>
<section class="hero"><h2>Galley</h2><p>我的游戏、电影和剧集记录。</p><div class="stats"><div class="stat"><b id="all">0</b><span>全部作品</span></div><div class="stat"><b id="games">0</b><span>游戏</span></div><div class="stat"><b id="screen">0</b><span>电影 / 剧集</span></div><div class="stat"><b id="avg">—</b><span>平均评分</span></div></div></section></div>
<p id="status" class="status muted" role="status" aria-live="polite">正在读取 Galley……</p>
<div class="toolbar"><div class="shell"><input id="q" class="search" placeholder="搜索……" aria-label="搜索作品"><select id="sort" class="sort" aria-label="作品排序"><option value="experienced-desc">接触时间：新 → 旧</option><option value="experienced-asc">接触时间：旧 → 新</option><option value="name">名称 A → Z</option><option value="rating">评分：高 → 低</option></select><button class="chip active" data-f="all">全部</button><button class="chip" data-f="game">游戏</button><button class="chip" data-f="film">电影</button><button class="chip" data-f="series">剧集</button></div></div>
<main id="dashboard" class="shell"><div id="items"><div class="empty">正在读取作品……</div></div></main>
<dialog id="auth"><div class="dialog-inner"><div class="dialog-head"><h2 id="auth-title">管理员登录</h2><button id="auth-close" class="btn" type="button" aria-label="关闭登录">关闭</button></div><p id="setup-note" class="muted" hidden>首次设置：填写原管理码，创建你自己的邮箱账号。以后使用邮箱和密码登录。</p><form id="auth-form">
<div class="field"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div>
<div id="code-field" class="field" hidden><label for="code">原管理码（仅首次设置需要）</label><input id="code" type="password" autocomplete="off"></div>
<button id="login" class="btn primary" type="submit">登录</button>
</form><p id="auth-status" class="muted" role="status" aria-live="polite"></p></div></dialog>
<dialog id="detail-dialog"><div class="dialog-inner"><div class="dialog-head"><div class="actions"><button id="detail-edit" class="btn primary" hidden>编辑作品</button></div><button id="detail-close" class="btn" aria-label="关闭作品详情">关闭</button></div><div id="detail-content" class="detail-view"></div></div></dialog>
<dialog id="editor"><div class="dialog-inner"><div class="dialog-head"><h2 id="editor-title">编辑作品</h2><button id="editor-close" class="btn" aria-label="关闭编辑">关闭</button></div><form id="edit-form">
<div class="form-grid"><div class="field"><label for="title">标题</label><input id="title" required></div><div class="field"><label for="type">类型</label><select id="type"><option value="game">游戏</option><option value="film">电影</option><option value="series">剧集</option></select></div>
<div class="field"><label for="year">发行年份</label><input id="year" type="number" min="1800" max="2200"></div><div class="field"><label for="experienced">接触年份</label><input id="experienced" type="number" min="1800" max="2200"></div>
<div class="field"><label for="rating">整体评分 / 10</label><input id="rating" type="number" min="0" max="10" step=".1"></div><div class="field"><label for="favorite">最重要</label><select id="favorite"><option value="false">否</option><option value="true">是</option></select></div></div>
<div class="field"><label for="tags">标签（逗号分隔）</label><input id="tags"></div><div class="field"><label for="excerpt">简短介绍</label><textarea id="excerpt"></textarea></div>
<img id="cover-preview" class="cover-preview" alt="当前封面" hidden><div class="field"><label for="cover">封面图片（不选则保留，最大 2 MB）</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><label class="muted"><input id="clear-cover" type="checkbox" style="width:auto">清除当前封面</label>
<h3>分项评分</h3><div id="scores" class="form-scores"></div><div class="field"><label for="review">完整体验</label><textarea id="review"></textarea></div>
<div class="form-footer"><button type="submit" class="btn primary">保存到云端</button><button id="cancel" type="button" class="btn">取消</button><button id="delete" type="button" class="btn danger">删除作品</button></div></form><p id="editor-status" class="muted" role="status" aria-live="polite"></p></div></dialog>
<dialog id="tools"><div class="dialog-inner"><div class="dialog-head"><h2>数据工具</h2><button id="tools-close" class="btn" aria-label="关闭数据工具">关闭</button></div><p id="account" class="muted"></p><div class="actions"><button id="refresh" class="btn">刷新作品</button><button id="export" class="btn">导出云端备份</button></div><details><summary>导入 / 恢复备份</summary><p class="muted">按作品 ID 合并，同名且 ID 不同的作品会保留。</p><form id="import-form"><div class="field"><input id="backup" type="file" accept=".json,application/json" required aria-label="备份文件"></div><button class="btn" type="submit">导入 / 恢复</button></form></details><details><summary>批量添加作品</summary><form id="bulk-form"><div class="field"><label for="bulk-type">类型</label><select id="bulk-type"><option value="game">游戏</option><option value="film">电影</option><option value="series">剧集</option></select></div><div class="field"><label for="lines">一行一个：标题 | 发行年份 | 接触年份 | 评分</label><textarea id="lines" required></textarea></div><button type="submit" class="btn primary">批量加入云端</button></form></details><p id="tools-status" class="muted" role="status" aria-live="polite"></p></div></dialog>
</body></html>
