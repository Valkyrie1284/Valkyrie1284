<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Galley · Detail</title>
<style>
:root{--bg:#090a0d;--text:#f3f4f7;--muted:#969ca8;--line:#282c35;--accent:#c9b7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 12% -5%,#242039 0,transparent 28%),radial-gradient(circle at 88% 0,#18243a 0,transparent 22%),var(--bg);font-family:Inter,system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:26px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:34px}.back{color:#d7d9df;text-decoration:none}.hero{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:48px;align-items:start}.cover{background:#05060a;border:1px solid var(--line);border-radius:22px;overflow:hidden}.cover img{width:100%;height:auto;display:block}.placeholder{aspect-ratio:2/3;display:flex;align-items:flex-end;padding:24px;background:linear-gradient(145deg,#3b4055,#191725);font:34px Georgia,serif}.kicker{color:var(--accent);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px}.title{font:500 clamp(44px,6vw,78px) Georgia,serif;letter-spacing:-.045em;line-height:.98;margin:12px 0 20px}.meta{color:var(--muted);line-height:1.8}.overall{margin-top:28px;display:flex;align-items:flex-end;gap:12px}.scorebig{font:72px Georgia,serif;line-height:.85}.outof{color:var(--muted);font-size:16px;margin-bottom:7px}.section{margin-top:52px;padding-top:28px;border-top:1px solid var(--line)}.section h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#b8bdc8;margin:0 0 20px}.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.score{padding:18px;border:1px solid var(--line);background:rgba(17,19,25,.75);border-radius:15px}.scorehead{display:flex;justify-content:space-between;gap:10px}.scorenum{font:26px Georgia,serif}.bar{height:5px;border-radius:999px;background:#252a34;overflow:hidden;margin-top:14px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#8175b8,#d8d0ff)}.review{white-space:pre-wrap;font-size:17px;line-height:1.9;color:#d8dbe2;max-width:920px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{border:1px solid var(--line);background:#171a21;border-radius:999px;padding:6px 9px;color:#c5c9d1;font-size:12px}.empty{border:1px dashed var(--line);border-radius:18px;padding:50px;text-align:center;color:var(--muted)}
@media(max-width:800px){.shell{padding:18px}.hero{grid-template-columns:1fr;gap:26px}.cover{max-width:330px}.scores{grid-template-columns:1fr 1fr}}@media(max-width:520px){.scores{grid-template-columns:1fr}.title{font-size:46px}.scorebig{font-size:58px}}
</style>
</head>
<body>
<div class="shell">
  <div class="nav"><a class="back" href="./">← 返回 Galley</a></div>
  <div id="content"><div class="empty">正在读取作品……</div></div>
</div>
<script>
const API="https://mbqizwojhfwxpgkbayhr.supabase.co/functions/v1/galley-api";
const TYPE={game:'游戏',film:'电影',series:'剧集'};
const DIMS={
 game:[['story','剧情'],['gameplay','玩法'],['visuals','画面与美术'],['audio','音乐与音效'],['atmosphere','氛围与沉浸'],['performance','演出']],
 film:[['story','剧情'],['characters','角色'],['performance','表演'],['visuals','画面与摄影'],['audio','音乐与声音'],['pacing','节奏']],
 series:[['story','剧情'],['characters','角色'],['performance','表演'],['visuals','画面与摄影'],['audio','音乐与声音'],['pacing','节奏']]
};
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=new URLSearchParams(location.search).get('id');
async function load(){
  try{
    const r=await fetch(API+'?action=get&id='+encodeURIComponent(id));
    const j=await r.json();if(!r.ok)throw new Error(j.error||'读取失败');
    const x=j.item,s=x.scores||{};
    document.title='Galley · '+x.title;
    const cover=x.cover?'<img src="'+esc(x.cover)+'" alt="">':'<div class="placeholder">'+esc(x.title)+'</div>';
    const tags=(x.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
    const scores=(DIMS[x.type]||DIMS.game).map(([k,l])=>{const v=Number(s[k]);return '<div class="score"><div class="scorehead"><div>'+l+'</div><div class="scorenum">'+(v?v.toFixed(1):'—')+'</div></div><div class="bar"><span style="width:'+(v?Math.min(100,v*10):0)+'%"></span></div></div>'}).join('');
    document.querySelector('#content').innerHTML='<section class="hero"><div class="cover">'+cover+'</div><div><div class="kicker">'+(TYPE[x.type]||x.type)+'</div><h1 class="title">'+esc(x.title)+'</h1><div class="meta">'+(x.year||'未知年份')+(x.experienced?' · 接触于 '+x.experienced:'')+'</div><div class="overall"><div class="scorebig">'+(Number(x.rating)>0?Number(x.rating).toFixed(1):'—')+'</div><div class="outof">/ 10</div></div><div class="tags" style="margin-top:22px">'+tags+'</div></div></section><section class="section"><h2>分项评分</h2><div class="scores">'+scores+'</div></section><section class="section"><h2>我的体验</h2><div class="review">'+esc(x.review||'还没有写。')+'</div></section>';
  }catch(e){document.querySelector('#content').innerHTML='<div class="empty">读取失败：'+esc(e.message)+'</div>'}
}
load();
</script>
</body></html>
