<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Galley</title>
<style>
:root{
  --bg:#090a0d;--panel:#111319;--panel2:#171a21;--text:#f3f4f7;--muted:#969ca8;
  --line:#282c35;--accent:#c9b7ff;--accent2:#8fa8ff;--danger:#ff8e8e;
  --shadow:0 24px 80px rgba(0,0,0,.38)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{
  margin:0;min-height:100vh;color:var(--text);
  background:radial-gradient(circle at 18% -10%,#242039 0,transparent 30%),
             radial-gradient(circle at 88% 0,#18243a 0,transparent 25%),var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1240px;margin:auto;padding:24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:18px}
.brand{display:flex;gap:13px;align-items:center}.sigil{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;display:grid;place-items:center;background:#11131a;font:700 20px/1 Georgia,serif}
.brand h1{margin:0;font-size:17px;letter-spacing:.18em}.brand small{display:block;margin-top:4px;color:var(--muted)}
.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#13161d;color:var(--text);border-radius:11px;padding:9px 13px}.btn:hover{background:#1b1f28}.btn.primary{background:#eee;color:#0b0c10;border-color:#eee;font-weight:750}.btn.danger{color:#ffb2b2;border-color:#553033;background:transparent}
.hero{padding:58px 0 34px}.hero h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,6vw,72px);font-weight:500;letter-spacing:-.04em;line-height:1;margin:0 0 14px;max-width:930px}.hero p{max-width:700px;color:#b2b6c0;font-size:16px;line-height:1.7;margin:0}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px}.stat b{font-size:28px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.toolbar{position:sticky;top:0;z-index:10;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(9,10,13,.82);backdrop-filter:blur(16px)}
.toolbar .shell{display:flex;gap:9px;align-items:center;padding-top:13px;padding-bottom:13px}.search{flex:1;min-width:220px;border:1px solid var(--line);background:#0f1117;color:var(--text);border-radius:11px;padding:10px 12px}
.chip{border:1px solid var(--line);background:#101218;color:var(--muted);border-radius:999px;padding:8px 11px}.chip.active{background:#ececf0;color:#111;border-color:#ececf0}
main.shell{padding-top:28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{border:1px solid var(--line);background:linear-gradient(180deg,#171a21,#101218);border-radius:19px;overflow:hidden;box-shadow:var(--shadow);transition:.22s ease;cursor:pointer}.card:hover{transform:translateY(-4px);border-color:#3f4653}
.cover{height:230px;padding:17px;display:flex;align-items:flex-end;position:relative;isolation:isolate;background:linear-gradient(145deg,var(--c1),var(--c2))}
.cover:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(0,0,0,.72),transparent 70%)}
.cover-title{font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1.02;letter-spacing:-.04em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.card-body{padding:14px 15px 17px}.meta{display:flex;gap:10px;font-size:11px;color:var(--muted)}.card h3{font-size:15px;margin:8px 0 14px}.card-rating{font-family:Georgia,"Times New Roman",serif;font-size:26px;line-height:1;color:var(--text);letter-spacing:-.02em}.stars{color:var(--accent);letter-spacing:.08em}.excerpt{font-size:13px;color:#b9bdc6;line-height:1.52;margin-bottom:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:18px;padding:55px 25px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#dddfe5;font-size:17px;margin-bottom:7px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}
.dialog{width:min(850px,100%);max-height:92vh;overflow:auto;background:#101218;border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow)}.dialog-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;padding:21px;border-bottom:1px solid var(--line)}.dialog-head h3{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:29px;font-weight:500}.close{border:0;background:transparent;color:var(--muted);font-size:25px}.dialog-body{padding:21px}.detail-meta{color:var(--muted);font-size:12px;margin-top:7px;line-height:1.6}.detail-review{white-space:pre-wrap;color:#d9dbe1;line-height:1.82}.section-title{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin:25px 0 9px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{border:1px solid var(--line);background:#171a21;border-radius:999px;padding:5px 8px;color:#c5c9d1;font-size:11px}.dialog-foot{padding:0 21px 21px;display:flex;justify-content:space-between;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:11px}.field input,.field select,.field textarea{border:1px solid var(--line);background:#0b0d12;color:var(--text);border-radius:11px;padding:10px 11px}.field textarea{min-height:150px;resize:vertical}
.file-input{display:none}.footer{color:#686e7b;font-size:11px;text-align:center;padding:48px 20px 30px}
@media(max-width:680px){.shell{padding-left:17px;padding-right:17px}.top{align-items:flex-start}.hero{padding-top:45px}.hero h2{font-size:54px}.toolbar .shell{overflow:auto;flex-wrap:nowrap}.search{min-width:190px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="sigil">G</div>
      <div><h1>GALLEY</h1><small>personal media log</small></div>
    </div>
    <div class="actions">
      <button class="btn" id="importBtn">导入</button>
      <button class="btn" id="exportBtn">备份</button>
      <button class="btn primary" id="addBtn">+ 添加作品</button>
      <input class="file-input" id="importFile" type="file" accept="application/json,.json">
    </div>
  </header>

  <section class="hero">
    <h2>Galley</h2>
    <p>我的游戏、电影和剧集记录。这里保存玩过、看过的作品，以及我自己的评分、评论和体验。</p>
    <div class="stats">
      <div class="stat"><b id="countAll">0</b><span>全部作品</span></div>
      <div class="stat"><b id="countGame">0</b><span>游戏</span></div>
      <div class="stat"><b id="countScreen">0</b><span>电影 / 剧集</span></div>
      <div class="stat"><b id="avgRating">—</b><span>平均评分</span></div>
    </div>
  </section>
</div>

<div class="toolbar">
  <div class="shell">
    <input id="search" class="search" placeholder="搜索标题、标签或自己的文字……">
    <button class="chip active" data-filter="all">全部</button>
    <button class="chip" data-filter="game">游戏</button>
    <button class="chip" data-filter="film">电影</button>
    <button class="chip" data-filter="series">剧集</button>
    <button class="chip" data-filter="favorite">最重要</button>
  </div>
</div>

<main class="shell"><div id="grid" class="grid"></div></main>
<div class="footer">Galley · stored locally in your browser</div>

<div class="modal" id="detailModal"><div class="dialog">
  <div class="dialog-head"><div><h3 id="detailTitle"></h3><div class="detail-meta" id="detailMeta"></div></div><button class="close" data-close="detailModal">×</button></div>
  <div class="dialog-body">
    <div class="section-title">我的体验</div><div class="detail-review" id="detailReview"></div>
    <div class="section-title">标签</div><div class="tags" id="detailTags"></div>
  </div>
  <div class="dialog-foot"><button class="btn danger" id="deleteBtn">删除</button><button class="btn" id="editBtn">编辑</button></div>
</div></div>

<div class="modal" id="editModal"><div class="dialog">
  <div class="dialog-head"><div><h3 id="formTitle">添加作品</h3><div class="detail-meta">这份记录只属于这个浏览器。需要换设备时，用“备份 / 导入”。</div></div><button class="close" data-close="editModal">×</button></div>
  <form id="mediaForm">
    <div class="dialog-body"><div class="form-grid">
      <div class="field"><label>标题</label><input id="fTitle" required></div>
      <div class="field"><label>类型</label><select id="fType"><option value="game">游戏</option><option value="film">电影</option><option value="series">剧集</option></select></div>
      <div class="field"><label>发行年份</label><input id="fYear" type="number" min="1880" max="2100"></div>
      <div class="field"><label>整体评分 / 10</label><input id="fRating" type="number" min="0" max="10" step="0.1"></div>
      <div class="field"><label>接触年份</label><input id="fExperienced" type="number" min="1900" max="2100"></div>
      <div class="field full"><label>封面图片</label><input id="fCoverFile" type="file" accept="image/*"></div>
      <div class="field full"><label>当前封面</label><div style="display:flex;align-items:center;gap:12px"><img id="coverPreview" alt="" style="display:none;width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><span id="coverStatus" style="color:var(--muted);font-size:12px">未设置</span><button class="btn" id="clearCoverBtn" type="button">清除封面</button></div></div>
      <div class="field full"><label>标签（逗号分隔）</label><input id="fTags" placeholder="青春, 时间, 失去"></div>
      <div class="field full"><label>一句话</label><input id="fExcerpt" placeholder="它为什么值得留在这里？"></div>
      <div class="field full"><label>完整体验</label><textarea id="fReview" placeholder="写下真正记住的东西，不必像影评。"></textarea></div>
      <div class="field"><label>最重要的作品</label><select id="fFavorite"><option value="false">否</option><option value="true">是</option></select></div>
    </div></div>
    <div class="dialog-foot"><span></span><button class="btn primary" type="submit">保存</button></div>
  </form>
</div></div>

<script>
const KEY='galley_media_v1';
const SEED_DATA=[
  {id:'outlast',title:'Outlast',type:'game',year:2013,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false},
  {id:'outlast-whistleblower',title:'Outlast: Whistleblower',type:'game',year:2014,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false},
  {id:'outlast-2',title:'Outlast 2',type:'game',year:2017,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false},
  {id:'outlast-trials',title:'The Outlast Trials',type:'game',year:2024,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false},
  {id:'life-is-strange',title:'Life is Strange',type:'game',year:2015,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false},
  {id:'twd-season-one',title:'The Walking Dead: Season One',type:'game',year:2012,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false},
  {id:'twd-final-season',title:'The Walking Dead: The Final Season',type:'game',year:2018,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false},
  {id:'a-space-for-the-unbound',title:'A Space for the Unbound',type:'game',year:2023,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false},
  {id:'until-then',title:'Until Then',type:'game',year:2024,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false},
  {id:'beyond-two-souls',title:'Beyond: Two Souls',type:'game',year:2013,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false},
  {id:'cyberpunk-2077',title:'Cyberpunk 2077',type:'game',year:2020,rating:0,stayed:0,experienced:null,tags:[],excerpt:'',review:'',favorite:false}
];
const savedData=localStorage.getItem(KEY);
let data=[];
try{
  data=savedData?JSON.parse(savedData):[];
  if(!Array.isArray(data)) data=[];
}catch{
  data=[];
}
let changed=false;
for(const seed of SEED_DATA){
  if(!data.some(item=>item.id===seed.id)){
    data.push({...seed});
    changed=true;
  }
}
if(!savedData||changed)localStorage.setItem(KEY,JSON.stringify(data));
let filter='all',selected=null,editing=null,tempCover=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const typeName={game:'游戏',film:'电影',series:'剧集'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){alert('浏览器存储空间不够了。可以先导出备份，或删除一些封面图片。');throw e;}}
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function palette(seed){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))%360;return ['hsl('+h+' 28% 34%)','hsl('+((h+65)%360)+' 28% 20%)'];}
function render(){
  const q=$('#search').value.trim().toLowerCase();
  const list=data.filter(x=>{
    const inFilter=filter==='all'||x.type===filter||(filter==='favorite'&&x.favorite);
    const blob=[x.title,x.excerpt,x.review,(x.tags||[]).join(' ')].join(' ').toLowerCase();
    return inFilter&&(!q||blob.includes(q));
  });
  $('#grid').innerHTML=list.length?list.map(x=>{
    const [c1,c2]=palette(x.title);
    const rating=Number(x.rating);
    const coverStyle=x.cover?'background-image:linear-gradient(to top,rgba(0,0,0,.25),rgba(0,0,0,.03)),url('+JSON.stringify(x.cover)+');background-size:cover;background-position:center':'--c1:'+c1+';--c2:'+c2;
    const coverLabel=x.cover?'':'<div class="cover-title">'+esc(x.title)+'</div>';
    return '<article class="card" data-id="'+esc(x.id)+'"><div class="cover" style="'+coverStyle+'">'+coverLabel+'</div><div class="card-body"><div class="meta"><span>'+esc(typeName[x.type]||x.type)+' · '+(x.year||'—')+'</span></div><h3>'+esc(x.title)+'</h3><div class="card-rating">'+(rating?rating.toFixed(1)+'/10':'未评分')+'</div></div></article>';
  }).join(''):'<div class="empty"><strong>这里还是空的。</strong>从第一部你真正想留下来的作品开始。</div>';
  $$('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
  $('#countAll').textContent=data.length;
  $('#countGame').textContent=data.filter(x=>x.type==='game').length;
  $('#countScreen').textContent=data.filter(x=>x.type==='film'||x.type==='series').length;
  const ratings=data.map(x=>Number(x.rating)).filter(x=>x>0);
  $('#avgRating').textContent=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1):'—';
}
function openDetail(id){
  selected=data.find(x=>x.id===id);if(!selected)return;
  $('#detailTitle').textContent=selected.title;
  $('#detailMeta').textContent=(typeName[selected.type]||selected.type)+' · '+(selected.year||'未知年份')+' · 我的评分 '+(selected.rating||'—')+'/10'+(selected.experienced?' · 接触于 '+selected.experienced:'');
  $('#detailReview').textContent=selected.review||selected.excerpt||'还没有写。';
  $('#detailTags').innerHTML=(selected.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')||'<span class="tag">暂无</span>';
  $('#detailModal').classList.add('show');
}
function openForm(item=null){
  editing=item;$('#formTitle').textContent=item?'编辑作品':'添加作品';
  $('#fTitle').value=item?.title||'';$('#fType').value=item?.type||'game';$('#fYear').value=item?.year||'';
  $('#fRating').value=item?.rating??'';$('#fExperienced').value=item?.experienced||'';
  $('#fTags').value=(item?.tags||[]).join(', ');$('#fExcerpt').value=item?.excerpt||'';$('#fReview').value=item?.review||'';
  $('#fFavorite').value=String(!!item?.favorite);
  $('#fCoverFile').value='';tempCover=item?.cover||null;updateCoverPreview();
  $('#editModal').classList.add('show');
}
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('show'));
$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));
$$('.chip').forEach(b=>b.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
$('#search').oninput=render;$('#addBtn').onclick=()=>openForm();
$('#editBtn').onclick=()=>{if(selected){$('#detailModal').classList.remove('show');openForm(selected)}};
$('#deleteBtn').onclick=()=>{if(selected&&confirm('删除“'+selected.title+'”？')){data=data.filter(x=>x.id!==selected.id);save();$('#detailModal').classList.remove('show');render()}};
function updateCoverPreview(){
  const img=$('#coverPreview'),status=$('#coverStatus');
  if(tempCover){img.src=tempCover;img.style.display='block';status.textContent='已设置';}
  else{img.removeAttribute('src');img.style.display='none';status.textContent='未设置';}
}
function compressCover(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const W=360,H=480,canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
        canvas.width=W;canvas.height=H;
        const scale=Math.max(W/img.width,H/img.height);
        const dw=img.width*scale,dh=img.height*scale;
        ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      }catch(err){URL.revokeObjectURL(url);reject(err);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image'));};
    img.src=url;
  });
}
$('#fCoverFile').onchange=async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{tempCover=await compressCover(file);updateCoverPreview();}
  catch{alert('封面图片读取失败，请换一张图片。');}
};
$('#clearCoverBtn').onclick=()=>{tempCover=null;$('#fCoverFile').value='';updateCoverPreview();};
$('#mediaForm').onsubmit=e=>{
  e.preventDefault();
  const item={
    id:editing?.id||(crypto.randomUUID?crypto.randomUUID():String(Date.now())),
    title:$('#fTitle').value.trim(),type:$('#fType').value,year:Number($('#fYear').value)||null,
    rating:Number($('#fRating').value)||0,cover:tempCover||null,experienced:Number($('#fExperienced').value)||null,
    tags:$('#fTags').value.split(',').map(x=>x.trim()).filter(Boolean),excerpt:$('#fExcerpt').value.trim(),
    review:$('#fReview').value.trim(),favorite:$('#fFavorite').value==='true'
  };
  if(editing){const i=data.findIndex(x=>x.id===editing.id);data[i]={...editing,...item}}else data.unshift(item);
  save();$('#editModal').classList.remove('show');render();
};
$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),items:data},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='galley-backup.json';a.click();URL.revokeObjectURL(a.href);
};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
    const parsed=JSON.parse(await file.text());const items=Array.isArray(parsed)?parsed:parsed.items;
    if(!Array.isArray(items))throw new Error();
    if(confirm('导入会替换当前 Galley 中的 '+data.length+' 条记录，继续吗？')){data=items;save();render()}
  }catch{alert('这个文件不是有效的 Galley 备份。')}
  e.target.value='';
};
render();
</script>
</body>
</html>
