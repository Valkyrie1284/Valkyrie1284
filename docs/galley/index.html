<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Galley</title>
<style>
:root{--bg:#090a0d;--text:#f3f4f7;--muted:#969ca8;--line:#282c35}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 18% -10%,#242039 0,transparent 30%),radial-gradient(circle at 88% 0,#18243a 0,transparent 25%),var(--bg);font-family:Inter,system-ui,sans-serif}
button,input,select{font:inherit}.shell{max-width:1240px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:18px}.brand{display:flex;gap:13px;align-items:center}.sigil{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;display:grid;place-items:center;background:#11131a;font:700 20px Georgia,serif}.brand h1{margin:0;font-size:17px;letter-spacing:.18em}.brand small{display:block;color:var(--muted);margin-top:4px}.btn{border:1px solid var(--line);background:#13161d;color:var(--text);border-radius:10px;padding:9px 13px;text-decoration:none}
.hero{padding:58px 0 34px}.hero h2{font:500 clamp(42px,6vw,72px) Georgia,serif;letter-spacing:-.04em;margin:0 0 14px}.hero p{color:#b2b6c0}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:30px}.stat b{font-size:28px}.stat span{display:block;color:var(--muted);font-size:11px}
.toolbar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(9,10,13,.85)}.toolbar .shell{display:flex;gap:8px;align-items:center;padding-top:12px;padding-bottom:12px}.search{flex:1;min-width:200px}.search,.sort{background:#0f1117;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.chip{border:1px solid var(--line);background:#101218;color:var(--muted);border-radius:999px;padding:8px 11px;cursor:pointer}.chip.active{background:#eee;color:#111}
.year{margin:32px 0 44px}.year h2{font:500 32px Georgia,serif;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{border:1px solid var(--line);background:#111319;border-radius:18px;overflow:hidden;cursor:pointer}.cover{aspect-ratio:2/3;background:#05060a;display:flex;align-items:flex-end}.cover img{width:100%;height:100%;object-fit:contain}.ph{padding:18px;font:28px Georgia,serif}.body{padding:14px}.meta{font-size:11px;color:var(--muted)}.body h3{font-size:15px;margin:8px 0 13px}.rating{font:25px Georgia,serif}.empty{border:1px dashed var(--line);border-radius:16px;padding:48px;text-align:center;color:var(--muted)}
@media(max-width:680px){.shell{padding:17px}.toolbar .shell{overflow:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand"><div class="sigil">G</div><div><h1>GALLEY</h1><small>personal media log</small></div></div><a class="btn" href="./admin.html">管理</a></header>
<section class="hero"><h2>Galley</h2><p>我的游戏、电影和剧集记录。</p><div class="stats"><div class="stat"><b id="all">0</b><span>全部作品</span></div><div class="stat"><b id="games">0</b><span>游戏</span></div><div class="stat"><b id="screen">0</b><span>电影 / 剧集</span></div><div class="stat"><b id="avg">—</b><span>平均评分</span></div></div></section></div>
<div class="toolbar"><div class="shell"><input id="q" class="search" placeholder="搜索……"><select id="sort" class="sort"><option value="experienced-desc">接触时间：新 → 旧</option><option value="experienced-asc">接触时间：旧 → 新</option><option value="name">名称 A → Z</option><option value="rating">评分：高 → 低</option></select><button class="chip active" data-f="all">全部</button><button class="chip" data-f="game">游戏</button><button class="chip" data-f="film">电影</button><button class="chip" data-f="series">剧集</button></div></div>
<main class="shell"><div id="list"><div class="empty">正在读取 Galley…</div></div></main>
<script>
const API="https://mbqizwojhfwxpgkbayhr.supabase.co/functions/v1/galley-api";
const TYPES={game:'游戏',film:'电影',series:'剧集'};
let items=[],filter='all',sort='experienced-desc';
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function card(x){return '<div class="card" data-id="'+esc(x.id)+'"><div class="cover">'+(x.cover?'<img src="'+x.cover+'">':'<div class="ph">'+esc(x.title)+'</div>')+'</div><div class="body"><div class="meta">'+(TYPES[x.type]||x.type)+' · '+(x.year||'—')+'</div><h3>'+esc(x.title)+'</h3><div class="rating">'+(Number(x.rating)?Number(x.rating).toFixed(1)+'/10':'未评分')+'</div></div></div>'}
function render(){
 const q=$('#q').value.toLowerCase();let a=items.filter(x=>(filter==='all'||x.type===filter)&&(!q||[x.title,x.review,...(x.tags||[])].join(' ').toLowerCase().includes(q)));
 const ts=(x,y)=>x.title.localeCompare(y.title,undefined,{numeric:true,sensitivity:'base'});let out='';
 if(sort.startsWith('experienced')){const ys=[...new Set(a.map(x=>Number(x.experienced)||null).filter(Boolean))].sort((x,y)=>sort==='experienced-desc'?y-x:x-y);for(const y of ys){const rows=a.filter(x=>Number(x.experienced)===y).sort(ts);out+='<section class="year"><h2>'+y+'</h2><div class="grid">'+rows.map(card).join('')+'</div></section>'}const u=a.filter(x=>!x.experienced).sort(ts);if(u.length)out+='<section class="year"><h2>未填写接触年份</h2><div class="grid">'+u.map(card).join('')+'</div></section>'}else{if(sort==='name')a.sort(ts);if(sort==='rating')a.sort((x,y)=>(y.rating||0)-(x.rating||0)||ts(x,y));out='<div class="grid">'+a.map(card).join('')+'</div>'}
 $('#list').innerHTML=out||'<div class="empty">这里还没有云端作品。</div>';
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>location.href='./detail.html?id='+encodeURIComponent(c.dataset.id));
}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});
$('#q').oninput=render;$('#sort').onchange=e=>{sort=e.target.value;render()};
fetch(API+'?action=list').then(r=>r.json()).then(j=>{items=j.items||[];$('#all').textContent=items.length;$('#games').textContent=items.filter(x=>x.type==='game').length;$('#screen').textContent=items.filter(x=>x.type!=='game').length;const rs=items.map(x=>Number(x.rating)).filter(Boolean);$('#avg').textContent=rs.length?(rs.reduce((a,b)=>a+b,0)/rs.length).toFixed(1):'—';render()}).catch(e=>{$('#list').innerHTML='<div class="empty">云端读取失败：'+esc(e.message)+'</div>'});
</script>
</body></html>
