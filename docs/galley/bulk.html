<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Galley · 批量添加</title>
<style>
:root{--bg:#090a0d;--panel:#111319;--text:#f3f4f7;--muted:#969ca8;--line:#282c35;--accent:#c9b7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#242039 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}.shell{max-width:980px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:42px}.back{color:#d8dbe3;text-decoration:none}.btn{border:1px solid var(--line);background:#13161d;color:var(--text);border-radius:11px;padding:10px 14px;cursor:pointer}.btn.primary{background:#eee;color:#0a0b0e;border-color:#eee;font-weight:700}
h1{font-family:Georgia,"Times New Roman",serif;font-size:58px;font-weight:500;letter-spacing:-.04em;margin:0 0 14px}.lead{color:#b8bdc7;line-height:1.75;max-width:760px}
.panel{margin-top:34px;border:1px solid var(--line);background:rgba(17,19,25,.76);border-radius:18px;padding:22px}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.15em;color:#b8bdc7;margin:0 0 14px}
textarea{width:100%;min-height:360px;background:#0b0d12;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:14px;resize:vertical;line-height:1.65}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.field{display:flex;flex-direction:column;gap:6px;min-width:180px}.field label{font-size:12px;color:var(--muted)}select,input{background:#0b0d12;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.help{font-size:13px;color:var(--muted);line-height:1.7;margin-top:14px}.preview{margin-top:18px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.item small{color:var(--muted)}.result{margin-top:18px;color:#cfd3db}
code{background:#151820;border:1px solid var(--line);padding:2px 6px;border-radius:6px}
@media(max-width:640px){.shell{padding:18px}h1{font-size:44px}.item{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><a class="back" href="./">← 返回 Galley</a></div>
  <h1>批量添加</h1>
  <p class="lead">一行一个作品。你可以只写标题，也可以按“标题 | 发行年份 | 接触年份 | 评分”一起填。先把作品库搭起来，封面、分项评分和评论以后再慢慢补。</p>

  <div class="panel">
    <h2>默认类型</h2>
    <div class="row">
      <div class="field"><label>类型</label><select id="type"><option value="game">游戏</option><option value="film">电影</option><option value="series">剧集</option></select></div>
    </div>
  </div>

  <div class="panel">
    <h2>作品列表</h2>
    <textarea id="input" placeholder="例如：
Red Dead Redemption 2 | 2018 | 2024 | 9.3
Detroit: Become Human | 2018 | 2025 | 8.7
INSIDE

也支持：
The Last of Us Part II, 2020, 2025, 9.1"></textarea>
    <div class="help">
      支持用 <code>|</code>、中文逗号或英文逗号分隔。顺序固定为：<b>标题 → 发行年份 → 接触年份 → 评分</b>。除了标题以外，后面都可以留空。
    </div>
    <div class="row">
      <button class="btn" id="previewBtn">预览</button>
      <button class="btn primary" id="addBtn">批量加入 Galley</button>
    </div>
    <div class="result" id="result"></div>
    <div class="preview" id="preview"></div>
  </div>
</div>

<script>
const KEY='galley_media_v1';
const $=s=>document.querySelector(s);
function parseLine(line){
  const raw=line.trim(); if(!raw)return null;
  const parts=raw.split(/\s*[|,，]\s*/);
  const title=(parts[0]||'').trim(); if(!title)return null;
  const year=Number(parts[1])||null;
  const experienced=Number(parts[2])||null;
  const ratingRaw=Number(parts[3]);
  const rating=Number.isFinite(ratingRaw)&&ratingRaw>=0&&ratingRaw<=10?ratingRaw:0;
  return {title,year,experienced,rating};
}
function parsedItems(){return $('#input').value.split(/\r?\n/).map(parseLine).filter(Boolean)}
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function showPreview(){
 const items=parsedItems();
 $('#result').textContent=items.length?'识别到 '+items.length+' 部作品。':'还没有识别到作品。';
 $('#preview').innerHTML=items.map(x=>'<div class="item"><div><strong>'+esc(x.title)+'</strong><br><small>发行 '+(x.year||'—')+' · 接触 '+(x.experienced||'—')+'</small></div><div>'+(x.rating?x.rating.toFixed(1)+'/10':'未评分')+'</div></div>').join('');
}
$('#previewBtn').onclick=showPreview;
$('#input').addEventListener('input',()=>{$('#result').textContent='';$('#preview').innerHTML=''});
$('#addBtn').onclick=()=>{
 const items=parsedItems(); if(!items.length){alert('先贴一些作品进来。');return}
 let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch{data=[]}
 const type=$('#type').value;
 let added=0,skipped=0;
 for(const x of items){
   const duplicate=data.some(d=>String(d.title||'').trim().toLowerCase()===x.title.toLowerCase()&&d.type===type);
   if(duplicate){skipped++;continue}
   data.push({
     id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)),
     title:x.title,type,year:x.year,rating:x.rating,experienced:x.experienced,
     tags:[],excerpt:'',review:'',favorite:false,scores:{},cover:null
   });
   added++;
 }
 try{localStorage.setItem(KEY,JSON.stringify(data))}
 catch(e){alert('浏览器存储空间不足，无法保存。');return}
 $('#result').textContent='已加入 '+added+' 部作品'+(skipped?'，跳过 '+skipped+' 个同名重复条目。':'。');
 $('#preview').innerHTML='';
 if(added){setTimeout(()=>location.href='./',650)}
};
</script>
</body>
</html>
