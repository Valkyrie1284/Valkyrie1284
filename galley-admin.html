<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Galley Admin</title>
<style>
:root{--bg:#090a0d;--panel:#111319;--text:#f3f4f7;--muted:#969ca8;--line:#282c35;--ok:#9ed8a8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#242039 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit}.shell{max-width:920px;margin:auto;padding:28px}.back{color:#d8dbe3;text-decoration:none}.btn{border:1px solid var(--line);background:#161922;color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}.btn.primary{background:#eee;color:#111;border-color:#eee;font-weight:700}
h1{font:500 58px Georgia,serif;letter-spacing:-.04em;margin:38px 0 10px}.lead{color:#b8bdc7;line-height:1.7}.panel{margin-top:28px;border:1px solid var(--line);background:rgba(17,19,25,.8);border-radius:18px;padding:22px}.panel h2{margin:0 0 14px;font-size:14px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;background:#0b0d12;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px}textarea{min-height:220px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px;line-height:1.6}.ok{color:var(--ok)}.hidden{display:none}
</style>
</head>
<body>
<div class="shell">
<a class="back" href="https://valkyrie1284.github.io/Valkyrie1284/">← 返回 Galley</a>
<h1>Galley Admin</h1>
<p class="lead">只有管理员账号可以修改云端 Galley。</p>
<section class="panel" id="authPanel">
<h2>登录 / 注册</h2>
<div class="field"><label>邮箱</label><input id="email" type="email"></div>
<div class="field"><label>密码</label><input id="password" type="password"></div>
<div class="row"><button class="btn primary" id="loginBtn">登录</button><button class="btn" id="signupBtn">注册</button></div>
<p id="authMsg" class="muted"></p>
</section>
<section class="panel hidden" id="claimPanel">
<h2>首次认领管理员</h2>
<div class="field"><label>一次性认领码</label><input id="claimToken"></div>
<button class="btn primary" id="claimBtn">认领 Galley</button>
<p id="claimMsg" class="muted"></p>
</section>
<section class="panel hidden" id="adminPanel">
<h2>管理</h2>
<p class="ok">管理员权限已开启。</p>
<div class="row"><button class="btn primary" id="newBtn">+ 添加作品</button><button class="btn" id="logoutBtn">退出登录</button><button class="btn" id="exportBtn">导出云端备份</button></div>
</section>
<section class="panel hidden" id="bulkPanel">
<h2>批量添加</h2>
<div class="field"><label>默认类型</label><select id="bulkType"><option value="game">游戏</option><option value="film">电影</option><option value="series">剧集</option></select></div>
<div class="field"><label>一行一个：标题 | 发行年份 | 接触年份 | 评分</label><textarea id="bulkInput"></textarea></div>
<button class="btn primary" id="bulkBtn">批量加入云端</button>
<p id="bulkMsg" class="muted"></p>
</section>
</div>
<script src="./galley-admin.js"></script>
</body>
</html>
